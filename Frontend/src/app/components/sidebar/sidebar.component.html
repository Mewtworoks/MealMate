<aside class="side" [class.collapsed]="themeService.isSidebarCollapsed">
  <div class="side-top">
    <div class="logo">
      <span class="glyph">
        <img src="assets/logo/chef_hat.png" alt="MealMate">
      </span>
      <b class="brand-name">MealMate</b>
    </div>
    <button class="sidebar-toggle-btn" (click)="themeService.toggleSidebar()"
      [title]="themeService.isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <ion-icon
        [name]="themeService.isSidebarCollapsed ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
    </button>
  </div>

  <!-- CHEF SIDEBAR NAV -->
  <ng-container *ngIf="themeService.isAgent">
    <div class="navlabel">Chef Menu</div>
    <nav class="nav">
      <button routerLink="/agent-home" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="home-outline"></ion-icon><span class="nav-text">Dashboard</span>
      </button>
      <button routerLink="/manage-menu" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="restaurant-outline"></ion-icon><span class="nav-text">Manage Menu</span>
      </button>
      <button routerLink="/agent-earnings" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="wallet-outline"></ion-icon><span class="nav-text">Earnings</span>
      </button>
    </nav>
    <div class="side-foot">
      <button class="me" routerLink="/profile" title="View Profile">
        <span class="ava">🧑‍🍳</span>
        <span class="me-text" style="text-align:left">
          <span class="n">{{ chefName || 'Chef Kitchen' }}</span><br>
          <span class="s">Partner Account</span>
        </span>
      </button>
    </div>
  </ng-container>

  <!-- CUSTOMER SIDEBAR NAV -->
  <ng-container *ngIf="!themeService.isAgent">
    <div class="navlabel">Menu</div>
    <nav class="nav">
      <button routerLink="/customer-home" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="home-outline"></ion-icon><span class="nav-text">Home</span>
      </button>
      <button routerLink="/my-orders" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="bag-outline"></ion-icon><span class="nav-text">Orders</span><span class="pip"
          *ngIf="orderCount > 0">{{orderCount}}</span>
      </button>
      <button routerLink="/subscribe" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="calendar-outline"></ion-icon><span class="nav-text">Meal Plans</span>
      </button>
      <button routerLink="/manage-rotation" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="sync-outline"></ion-icon><span class="nav-text">Meal Rotation</span>
      </button>
      <button routerLink="/custom-meal" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="restaurant-outline"></ion-icon><span class="nav-text">Personal Chef</span>
      </button>
      <button routerLink="/health" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="heart-outline"></ion-icon><span class="nav-text">Health</span>
      </button>
      <button routerLink="/ai-concierge" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="chatbubbles-outline"></ion-icon><span class="nav-text">MealMantra AI</span>
      </button>
      <button routerLink="/wallet" routerLinkActive="on" [routerLinkActiveOptions]="{exact: true}">
        <ion-icon name="shield-checkmark-outline"></ion-icon><span class="nav-text">Wallet</span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="plan-mini" *ngIf="planWidget" (click)="planWidgetClick.emit()">
        <div class="t">ACTIVE PLAN</div>
        <div class="v">{{planWidget.planName}}</div>
        <div class="pbar"><i [style.width.%]="planWidget.percent"></i></div>
        <div class="f">
          <span>Day {{planWidget.currentDay}} of {{planWidget.totalDays}}</span>
          <span>{{planWidget.percent}}%</span>
        </div>
      </div>
      <button class="me" routerLink="/profile" title="View Profile">
        <span class="ava">{{userInitials}}</span>
        <span class="me-text" style="text-align:left">
          <span class="n">{{userName}}</span><br>
          <span class="s">Premium member</span>
        </span>
      </button>
    </div>
  </ng-container>
</aside>
