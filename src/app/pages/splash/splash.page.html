<ion-content [fullscreen]="true" class="splash-content">
  <div class="splash-container">
    <div class="logo-circle">
      <!-- Simple Flat Tiffin Dabba Icon -->
      <svg class="tiffin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Tiffin Layers -->
        <rect x="6" y="16" width="12" height="4" rx="1" fill="#F97316"/>
        <rect x="6" y="11" width="12" height="4" rx="1" fill="#F97316"/>
        <rect x="6" y="6" width="12" height="4" rx="1" fill="#F97316"/>
        <!-- Steel Frame/Handle -->
        <path d="M18 19V6C18 4.34315 16.6569 3 15 3H9C7.34315 3 6 4.34315 6 6V19" stroke="#F97316" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M10 3L10 1M14 3L14 1M10 1L14 1" stroke="#F97316" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="brand-section">
      <h1 class="brand-name">MealMate</h1>
      <p class="tagline">Ghar jaisa khana, doorstep pe</p>
    </div>

    <div class="loader-container">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
</ion-content>
