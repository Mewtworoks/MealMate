<ion-content [fullscreen]="true" class="mealmate-content">

  <!-- Carousel Background Section -->
  <div class="carousel-bg-section" [style.background]="meals[currentMealIndex].bgColor">

    <!-- Top Padding for Status Bar Area -->
    <div class="top-spacer"></div>

    <!-- Carousel Content -->
    <div class="carousel-viewport">
      <div class="carousel-card-stack">
        <!-- Next Card (Peek) -->
        <div class="card peek next" [style.background]="meals[(currentMealIndex + 1) % meals.length].bgColor"></div>

        <!-- Current Main Card -->
        <div class="card main animate-fade">
          <div class="dish-illustration">
            <img [src]="meals[currentMealIndex].image" [alt]="meals[currentMealIndex].name">
          </div>
          <div class="dish-info">
            <h2 class="dish-name">{{meals[currentMealIndex].name}}</h2>
            <p class="dish-sub">{{meals[currentMealIndex].description}}</p>
          </div>

          <!-- Pagination Dots -->
          <div class="pagination-dots">
            <div *ngFor="let m of meals; let i = index" class="dot" [class.active]="i === currentMealIndex"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet Overlay -->
  <div class="bottom-sheet-container">
    <div class="sheet-handle"></div>

    <div class="sheet-content">
      <!-- Brand Logo & Slogan -->
      <div class="brand-section">
        <div class="logo-wrapper">
          <img src="assets/logo/chef_hat.png" alt="MealMate Logo" class="brand-icon">
          <span class="brand-text">MealMate</span>
        </div>
        <p class="brand-slogan">Delicious Meals Delivered to Your Doorstep</p>
      </div>

      <!-- Main Login Flow -->
      <div class="animate-up">

        <h3 class="login-title">Welcome to MealMate</h3>
        <p class="login-subtitle">Choose your role and sign in to continue</p>

        <div class="role-selector">
          <div class="role-chip" [class.active]="role === 'customer'" (click)="role = 'customer'">
            <ion-icon name="person-outline"></ion-icon>
            <span>Customer</span>
          </div>
          <div class="role-chip" [class.active]="role === 'agent'" (click)="role = 'agent'">
            <ion-icon name="bicycle-outline"></ion-icon>
            <span>Delivery Agent</span>
          </div>
        </div>

        <div class="google-login-wrapper">
          <div id="google-btn"></div>
        </div>

        <div class="footer-links">
          <p class="link-text">By continuing, you agree to our <span class="highlight">Terms & Services</span></p>
        </div>
      </div>

    </div>
  </div>

</ion-content>
