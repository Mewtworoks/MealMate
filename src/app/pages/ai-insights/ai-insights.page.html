<ion-header class="premium-header ion-no-border">
  <div class="header-bg"></div>
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back" class="nav-back-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
    
    <div class="header-content">
      <div class="header-avatar">
        <ion-icon name="sparkles"></ion-icon>
      </div>
      <div class="header-text">
        <h1>AI Concierge</h1>
        <p>Your smart dining assistant</p>
      </div>
    </div>

    <ion-buttons slot="end">
      <ion-icon name="sparkles" class="top-sparkle"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content #content class="chat-content">
  <div class="messages-container">
    <div *ngFor="let msg of messages" class="msg-row" [class.user]="msg.role === 'user'">
      
      <!-- Avatar for AI only -->
      <div class="ai-avatar" *ngIf="msg.role !== 'user'">
        <ion-icon name="sparkles"></ion-icon>
      </div>

      <div class="msg-content">
        <div class="bubble">
          <p [innerHTML]="msg.content"></p>
        </div>
        <div class="msg-meta">
          <span class="time">{{ '7:30 PM' }}</span>
          <ion-icon name="checkmark-done" *ngIf="msg.role === 'user'" class="read-icon"></ion-icon>
        </div>
      </div>
      
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="msg-row">
      <div class="ai-avatar">
        <ion-icon name="sparkles"></ion-icon>
      </div>
      <div class="msg-content">
        <div class="bubble typing-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="premium-footer ion-no-border">
  <!-- Try These Section -->
  <div class="suggestions-wrapper" *ngIf="suggestions && suggestions.length > 0">
    <h3 class="suggestions-title">Try these</h3>
    <div class="suggestions-row">
      <div *ngFor="let s of suggestions" class="sugg-card" (click)="sendMessage(s)">
        <div class="sugg-left">
          <!-- Food icon for 'options', lightning for 'high-protein' or otherwise -->
          <ion-icon [name]="s.includes('options') ? 'basket' : 'flash'" class="sugg-icon"></ion-icon>
          <span class="sugg-text">{{s}}</span>
        </div>
        <ion-icon name="chevron-forward" class="sugg-chevron"></ion-icon>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-wrapper">
    <div class="input-box">
      <div class="plus-circle">
        <ion-icon name="add"></ion-icon>
      </div>
      
      <ion-input 
        class="chat-input"
        placeholder="Type your message..." 
        [(ngModel)]="userInput" 
        (keyup.enter)="sendMessage()"
        inputmode="text">
      </ion-input>

      <div class="send-circle" (click)="sendMessage()">
        <ion-icon name="send"></ion-icon>
      </div>
    </div>
  </div>
</ion-footer>
