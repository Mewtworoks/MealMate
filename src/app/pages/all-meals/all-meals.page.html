<ion-header class="ion-no-border sub-page-header">
  <div class="header-curve-bg"></div>
  <ion-toolbar class="transparent-toolbar" style="--padding-top: 5px;">
    <div class="header-content">
      <ion-button (click)="goBack()" class="back-btn-pill">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
      <div class="title-group">
        <h1 class="page-title">All Meals</h1>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="premium-content">
  <div class="content-wrapper">
    <!-- ===== SEARCH BAR ===== -->
    <div class="search-container">
      <ion-searchbar 
        [(ngModel)]="searchTerm" 
        (ionInput)="onSearchChange()" 
        placeholder="Search healthy dishes..." 
        class="custom-searchbar">
      </ion-searchbar>
    </div>

    <!-- ===== CATEGORIES ===== -->
    <div class="cat-section">
      <div class="cat-scroll">
        <div 
          *ngFor="let cat of categories" 
          class="cat-item" 
          [class.active]="selectedCategory === cat" 
          (click)="selectCategory(cat)">
          <span class="cat-label">{{cat}}</span>
        </div>
      </div>
    </div>

    <!-- ===== SKELETON LOADER ===== -->
    <div class="meals-grid-skeleton" *ngIf="isLoading">
      <div class="meal-skeleton-card" *ngFor="let i of [1,2,4,5,6]">
        <ion-skeleton-text animated class="sk-img"></ion-skeleton-text>
        <ion-skeleton-text animated class="sk-title"></ion-skeleton-text>
        <ion-skeleton-text animated class="sk-desc"></ion-skeleton-text>
        <div class="sk-footer">
          <ion-skeleton-text animated class="sk-price"></ion-skeleton-text>
          <ion-skeleton-text animated class="sk-btn"></ion-skeleton-text>
        </div>
      </div>
    </div>

    <!-- ===== NO RESULTS ===== -->
    <div class="no-results" *ngIf="!isLoading && filteredMeals.length === 0">
      <div class="no-results-icon">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
      <h3>No Meals Found</h3>
      <p>We couldn't find any meals matching "{{searchTerm}}". Try another keyword!</p>
    </div>

    <!-- ===== MEALS GRID ===== -->
    <div class="meals-grid" *ngIf="!isLoading && filteredMeals.length > 0">
      <div class="meal-card" *ngFor="let meal of filteredMeals">
        <div class="pc-thumb">
          <img [src]="meal.image" [alt]="meal.name">
          <div class="pc-rating">
            <ion-icon name="star"></ion-icon> {{getMealRating(meal)}}
          </div>
          <button class="pc-heart">
            <ion-icon name="heart-outline"></ion-icon>
          </button>
          <div class="pc-kcal">{{getMealKcal(meal)}}</div>
        </div>
        <div class="pc-body">
          <h4 class="pc-name">{{meal.name}}</h4>
          <p class="pc-sub">{{meal.category || 'Lunch'}}</p>
          <div class="pc-price-row">
            <span class="pc-price">₹{{meal.price}}</span>
            <!-- Quantity Control -->
            <ng-container *ngIf="cartService.getQuantity(meal.id) === 0; else qtyControl">
              <button class="pc-add-btn" (click)="addToCart(meal, $event)">
                <ion-icon name="add"></ion-icon>
              </button>
            </ng-container>
            <ng-template #qtyControl>
              <div class="pc-qty-control" (click)="$event.stopPropagation()">
                <button class="qty-btn" (click)="removeFromCart(meal.id, $event)">
                  <ion-icon name="remove"></ion-icon>
                </button>
                <span class="qty-val">{{cartService.getQuantity(meal.id)}}</span>
                <button class="qty-btn" (click)="addToCart(meal, $event)">
                  <ion-icon name="add"></ion-icon>
                </button>
              </div>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Blinkit-style Cart Pill -->
<app-cart-pill></app-cart-pill>
